main:
  push:
    - imports:
        - https://cnb.cool/maikebuke/RH/Notes/Plugins/Secrets/-/blob/main/github.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/tylzh97/oh-my-git.git
            auth_type: https
            username: ${GITHUB_SYNC_USER}
            password: ${GITHUB_SYNC_TOKEN}
            branch: main
            force: true
